<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>Barra superior</header>

    <nav class="sidebar">
        <ul>
            <li>Dasboard</li>
            <li>Productos</li>
            <li>Pedidos</li> 
            <li>Clientes</li>
        </ul>
    </nav>

    <main>
        <div class="toolbar">
            <input type="search" placeholder="Buscar productos...">

            <div class="toolbarActions">
                <button class="btn">Añadir producto</button>
                <button class="btn">Filtros</button>
                <button class="btn">Exportar</button>
            </div>
        </div>

        <div class="catalog">
            <h2>Catálogo</h2>

            <div class="catalog-grid">
                <div class="featured-banner">
                    <h3>Campaña Activa</h3>
                    <p>Hasta 50% de descuento</p>
                </div>
                
                <article class="product-card1">
                    <h3>Producto 1</h3>
                    <p>$19.99</p>
                </article>

                <article class="product-card2">
                    <h3>Producto 2</h3>
                    <p>$29.99</p>
                </article>

                <article class="product-card3">
                    <h3>Producto 3</h3>
                    <p>$39.99</p>
                </article>

                <article class="product-card4">
                    <h3>Producto 4</h3>
                    <p>$49.99</p>
                </article>
            </div>
            
        </div>

    </main>

    <footer></footer>
</body>
</html>
